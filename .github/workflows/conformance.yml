name: conformance

"on":
  push:
    branches: [main]
  pull_request:

# Least privilege: both jobs only read the checkout to run the suite. Declared
# explicitly rather than inherited, so the token's reach is a reviewable line
# instead of a repository default that changes when GitHub changes it.
permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime deps
        run: pip install mido matplotlib pyyaml pytest
      - name: Conformance gate (~2.5 min)
        run: |
          set -e
          export MUSE_SKIP_SLOW=1
          ./tools/run_tests.sh                    # 12 suites aggregate exit code

  slow-beethoven9:
    runs-on: ubuntu-latest
    continue-on-error: true          # allow-fail until W6 compute budget lands
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Full tier includes qa_frontend, which imports playwright; run_tests.sh
      # then installs the chromium binary. Install the full test requirements
      # (not just runtime deps) so the browser step has its module — with only
      # mido/matplotlib/pyyaml/pytest, the --full run dies at the chromium
      # install with "No module named playwright".
      - name: Install test deps
        run: pip install -r tools/requirements.test.txt
      - name: Slow conformance (Beethoven 9, ~30–35s)
        run: |
          ./tools/run_tests.sh --full                # 13 suites incl. B9 (allow-fail)
